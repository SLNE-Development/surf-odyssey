# Local development stack: PostgreSQL, RabbitMQ, Valkey, SeaweedFS with its admin UI, a Velocity proxy and the hub, home
# and pack Paper servers, which run from the run folders of their runtime modules. The pack server builds the resource
# pack and uploads it to SeaweedFS, every other server sends it to players from there. The microservices of the
# developmentStack extension in build.gradle.kts are added through a compose file generated into
# build/development-stack.
#
# Use the Gradle tasks in the "developmentStack" group to build, start, stop and clean it.
# Every value below can be overridden in a .env file next to this one (see .env.example).

name: surf-odyssey

x-rabbitmq-environment: &rabbitmq-environment
  SURF_RABBITMQ_HOST: rabbitmq
  SURF_RABBITMQ_PORT: 5672
  SURF_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-surf}
  SURF_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-surf}
  SURF_RABBITMQ_VHOST: /

x-valkey-environment: &valkey-environment
  SURF_REDIS_HOST: valkey
  SURF_REDIS_PORT: 6379
  SURF_REDIS_PASSWORD: ${VALKEY_PASSWORD:-surf}

# Every LuckPerms shares its storage in the luckperms schema, LUCKPERMS_SERVER names the server for contexts
x-luckperms-environment: &luckperms-environment
  LUCKPERMS_STORAGE_METHOD: postgresql
  LUCKPERMS_DATA_ADDRESS: postgres:5432
  LUCKPERMS_DATA_DATABASE: ${POSTGRES_DATABASE:-surf}
  LUCKPERMS_DATA_USERNAME: ${POSTGRES_USERNAME:-surf}
  LUCKPERMS_DATA_PASSWORD: ${POSTGRES_PASSWORD:-surf}
  LUCKPERMS_DATA_POOL_SETTINGS_PROPERTIES: currentSchema=luckperms

# Credentials for docker/paper/plugins/HuskSync/config.yml, which keeps player data in the husksync schema and
# syncs it between the servers through Valkey
x-husksync-environment: &husksync-environment
  CFG_POSTGRES_DATABASE: ${POSTGRES_DATABASE:-surf}
  CFG_POSTGRES_USERNAME: ${POSTGRES_USERNAME:-surf}
  CFG_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surf}
  CFG_VALKEY_PASSWORD: ${VALKEY_PASSWORD:-surf}

# Docker's default seccomp profile blocks io_uring, which Netty would otherwise pick for the RabbitMQ client.
# surf-rabbitmq and surf-redis shade Netty and read relocated property names.
x-java-tool-options: &java-tool-options >-
  -Dio.netty.transport.noNative=true
  -Ddev.slne.surf.rabbitmq.shaded.io.netty.transport.noNative=true
  -Ddev.slne.surf.redis.shaded.io.netty.transport.noNative=true

x-paper: &paper
  image: itzg/minecraft-server:2026.9.2-java25
  environment: &paper-environment
    <<: [ *rabbitmq-environment, *valkey-environment, *luckperms-environment, *husksync-environment ]
    JVM_OPTS: *java-tool-options
    EULA: "TRUE"
    TYPE: PAPER
    VERSION: "26.3"
    MEMORY: ${PAPER_MEMORY:-2G}
    # Players are authenticated by the proxy, which forwards them with the secret in paper-global.yml
    ONLINE_MODE: "false"
    REPLACE_ENV_DURING_SYNC: "true"
    CFG_VELOCITY_SECRET: ${VELOCITY_FORWARDING_SECRET:-surf-odyssey-development}
    # S3 access for the CraftEngine configs; clients download the pack from the public host
    CFG_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-odyssey}
    CFG_S3_SECRET_KEY: ${S3_SECRET_KEY:-odyssey-dev-secret}
    CFG_S3_PUBLIC_HOST: ${S3_PUBLIC_HOST:-localhost:8333}
    # Lets the console be attached with "docker compose attach" (detach with Ctrl+P, Ctrl+Q)
    CREATE_CONSOLE_IN_PIPE: "true"
  stdin_open: true
  tty: true
  depends_on:
    rabbitmq:
      condition: service_healthy
    valkey:
      condition: service_healthy

# Every hub server copies its world from docker/worlds on each start, so the map always matches the repository.
# FORCE_WORLD_COPY deletes the world folder of the run folder before the copy, so nothing built or changed on a hub
# survives a restart. docker/paper/hub/plugins holds the CraftEngine config that only sends the pack to players.
x-hub-environment: &hub-environment
  <<: *paper-environment
  FORCE_WORLD_COPY: "TRUE"
  COPY_PLUGINS_SRC: /plugins,/plugins-hub

services:
  postgres:
    image: postgres:17.6-alpine
    # One database for all microservices, each one uses its own schema. Every Paper server opens two
    # connection pools (LuckPerms and HuskSync), which exceed the default limit of 100 connections.
    command: [ "postgres", "-c", "max_connections=300" ]
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-surf}
      POSTGRES_USER: ${POSTGRES_USERNAME:-surf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surf}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-surf}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-surf}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 20

  valkey:
    image: valkey/valkey:9.0.6-alpine
    command: [ "valkey-server", "--requirepass", "${VALKEY_PASSWORD:-surf}" ]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "valkey-cli -a \"$${VALKEY_PASSWORD:-surf}\" --no-auth-warning ping | grep -q PONG" ]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-surf}

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    # Master, volume, filer and S3 gateway in one process; the S3 port is published for the Minecraft client.
    # The servers sign presigned URLs for seaweedfs:8333 and hand them to clients with the public host, so the
    # gateway checks signatures against seaweedfs:8333 first and against the requested host after that.
    command: [ "server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-s3.externalUrl=http://seaweedfs:8333", "-master.telemetry=false" ]
    ports:
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
      # SeaweedFS does not substitute environment variables, the keys in it are the defaults from .env.example
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  seaweedfs-admin:
    image: chrislusf/seaweedfs:4.48
    # The admin UI only listens on all interfaces when a password is set; the user is "admin"
    command: [ "admin", "-ip=0.0.0.0", "-port=23646", "-master=seaweedfs:9333" ]
    environment:
      WEED_ADMIN_PASSWORD: ${SEAWEEDFS_ADMIN_PASSWORD:-surf}
    ports:
      - "${SEAWEEDFS_ADMIN_PORT:-23646}:23646"
    depends_on: [ seaweedfs ]

  proxy:
    image: itzg/mc-proxy:java25-2026.9.0
    environment:
      <<: [ *rabbitmq-environment, *valkey-environment, *luckperms-environment ]
      LUCKPERMS_SERVER: proxy
      JVM_OPTS: *java-tool-options
      TYPE: VELOCITY
      MEMORY: ${PROXY_MEMORY:-512M}
      # Fills forwarding.secret, which has to match the secret in paper-global.yml
      CFG_VELOCITY_SECRET: ${VELOCITY_FORWARDING_SECRET:-surf-odyssey-development}
      REPLACE_ENV_SUFFIXES: "toml,secret,yml"
    ports:
      - "${PROXY_PORT:-25565}:25565"
    volumes:
      # Proxy files and plugins live in the run folder, docker/velocity is synced into it on start
      - ./surf-odyssey-runtime/surf-odyssey-runtime-velocity/run:/server
      - ./docker/velocity:/config:ro
    stdin_open: true
    tty: true
    depends_on:
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
      hub-lobby-01:
        condition: service_started
      hub-north-01:
        condition: service_started
      hub-south-01:
        condition: service_started
      home:
        condition: service_started

  hub-lobby-01:
    <<: *paper
    environment:
      <<: *hub-environment
      LUCKPERMS_SERVER: hub-lobby-01
      CFG_SURF_SERVER_NAME: hub-lobby-01
      CFG_SURF_SERVER_DISPLAY_NAME: Lobby
      CFG_SURF_SERVER_CATEGORY: odyssey-hub-lobby
      WORLD: /worlds/lobby
    volumes:
      # Server files, plugins and plugin configs all live in the run folder. docker/paper/config, docker/paper/plugins
      # and docker/paper/hub/plugins are synced into its config and plugins folders on start.
      - ./surf-odyssey-runtime/surf-odyssey-runtime-paper/surf-odyssey-runtime-paper-hub/surf-odyssey-runtime-paper-hub-lobby/run/hub-lobby-01:/data
      - ./docker/worlds/lobby:/worlds/lobby:ro
      - ./docker/paper/config:/config:ro
      - ./docker/paper/plugins:/plugins:ro
      - ./docker/paper/hub/plugins:/plugins-hub:ro

  hub-north-01:
    <<: *paper
    environment:
      <<: *hub-environment
      LUCKPERMS_SERVER: hub-north-01
      CFG_SURF_SERVER_NAME: hub-north-01
      CFG_SURF_SERVER_DISPLAY_NAME: Norden
      CFG_SURF_SERVER_CATEGORY: odyssey-hub-north
      WORLD: /worlds/north
    volumes:
      - ./surf-odyssey-runtime/surf-odyssey-runtime-paper/surf-odyssey-runtime-paper-hub/surf-odyssey-runtime-paper-hub-north/run/hub-north-01:/data
      - ./docker/worlds/north:/worlds/north:ro
      - ./docker/paper/config:/config:ro
      - ./docker/paper/plugins:/plugins:ro
      - ./docker/paper/hub/plugins:/plugins-hub:ro

  hub-south-01:
    <<: *paper
    environment:
      <<: *hub-environment
      LUCKPERMS_SERVER: hub-south-01
      CFG_SURF_SERVER_NAME: hub-south-01
      CFG_SURF_SERVER_DISPLAY_NAME: Süden
      CFG_SURF_SERVER_CATEGORY: odyssey-hub-south
      WORLD: /worlds/south
    volumes:
      - ./surf-odyssey-runtime/surf-odyssey-runtime-paper/surf-odyssey-runtime-paper-hub/surf-odyssey-runtime-paper-hub-south/run/hub-south-01:/data
      - ./docker/worlds/south:/worlds/south:ro
      - ./docker/paper/config:/config:ro
      - ./docker/paper/plugins:/plugins:ro
      - ./docker/paper/hub/plugins:/plugins-hub:ro

  home:
    <<: *paper
    environment:
      <<: *paper-environment
      LUCKPERMS_SERVER: home
      CFG_SURF_SERVER_NAME: home
      CFG_SURF_SERVER_DISPLAY_NAME: Home
      CFG_SURF_SERVER_CATEGORY: home
      # docker/paper/home/plugins holds the configs only the home server needs, e.g. surf-polar-paper, and
      # docker/paper/hub/plugins the CraftEngine config that only sends the pack to players
      COPY_PLUGINS_SRC: /plugins,/plugins-home,/plugins-home-ce
    volumes:
      - ./surf-odyssey-runtime/surf-odyssey-runtime-paper/surf-odyssey-runtime-paper-home/run:/data
      - ./docker/paper/config:/config:ro
      - ./docker/paper/plugins:/plugins:ro
      - ./docker/paper/home/plugins:/plugins-home:ro
      - ./docker/paper/hub/plugins:/plugins-home-ce:ro

  pack-01:
    <<: *paper
    environment:
      <<: *paper-environment
      LUCKPERMS_SERVER: pack-01
      CFG_SURF_SERVER_NAME: pack-01
      CFG_SURF_SERVER_DISPLAY_NAME: Pack
      CFG_SURF_SERVER_CATEGORY: odyssey-pack
      # docker/paper/pack/plugins holds the CraftEngine config that builds the pack and uploads it to SeaweedFS
      COPY_PLUGINS_SRC: /plugins,/plugins-pack
    volumes:
      - ./surf-odyssey-runtime/surf-odyssey-runtime-paper/surf-odyssey-runtime-paper-pack/run/pack-01:/data
      - ./docker/paper/config:/config:ro
      - ./docker/paper/plugins:/plugins:ro
      - ./docker/paper/pack/plugins:/plugins-pack:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_started

volumes:
  postgres-data:
  rabbitmq-data:
  valkey-data:
  seaweedfs-data:
